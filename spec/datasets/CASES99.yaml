dataset: CASES99
version: 0.1.0
required_variables:
  - wind_u
  - wind_v
  - theta
  - z
time_resolution_seconds: 60
four_d_solver:
  solver: rodas5p
  hours: 14
  save_dt_seconds: 30
  initial_state:
    e: 1.0
    U: 5.0
    V: 0.0
    Ts: 285.15
  parameters:
    U_g: 10.0
    V_g: 0.0
    T_a: 285.15
    T_deep: 283.15
    R_down: 260.0
    beta_t: 15.0
    sigma_e: 15.0
    z0m: 0.02
    z0h: 0.005