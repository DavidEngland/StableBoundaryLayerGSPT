schema_version: 0.1.0
categories:
  - id: state_variables
    name: State Variables and Coordinates
  - id: fast_slow_parameters
    name: Fast-Slow and Regularization Parameters
  - id: closure_parameters
    name: Closure and Surface Coupling Parameters
  - id: diagnostics_invariants
    name: Diagnostics and Geometric Invariants
symbols:
  - id: e
    symbol_tex: e
    symbol_md: e
    code_key: e
    units_tex: "\\mathrm{m}^2\\,\\mathrm{s}^{-2}"
    units_md: m^2 s^-2
    name: Turbulent kinetic energy
    description: Fast turbulent state coordinate in the reduced 4D system.
    category: state_variables
  - id: U
    symbol_tex: U
    symbol_md: U
    code_key: U
    units_tex: "\\mathrm{m}\\,\\mathrm{s}^{-1}"
    units_md: m s^-1
    name: Zonal wind component
    description: Slow momentum coordinate aligned with geostrophic forcing.
    category: state_variables
  - id: V
    symbol_tex: V
    symbol_md: V
    code_key: V
    units_tex: "\\mathrm{m}\\,\\mathrm{s}^{-1}"
    units_md: m s^-1
    name: Meridional wind component
    description: Slow momentum coordinate orthogonal to U.
    category: state_variables
  - id: T_s
    symbol_tex: T_s
    symbol_md: T_s
    code_key: Ts
    units_tex: "\\mathrm{K}"
    units_md: K
    name: Surface skin temperature
    description: Slow thermodynamic coordinate coupled through the surface energy budget.
    category: state_variables
  - id: epsilon
    symbol_tex: "\\varepsilon"
    symbol_md: epsilon
    code_key: epsilon
    mustache_key: param_epsilon_code
    units_tex: "-"
    units_md: "-"
    name: Fast-slow timescale ratio
    description: Ratio between fast TKE relaxation and slow thermodynamic-dynamic evolution.
    category: fast_slow_parameters
  - id: delta
    symbol_tex: "\\delta"
    symbol_md: delta
    code_key: delta
    mustache_key: param_delta_code
    units_tex: "\\mathrm{m}^2\\,\\mathrm{s}^{-2}"
    units_md: m^2 s^-2
    name: Background TKE floor
    description: Regularization floor enforcing forward invariance near laminar conditions.
    category: fast_slow_parameters
  - id: alpha_safe
    symbol_tex: "\\alpha_{\\mathrm{safe}}"
    symbol_md: alpha_safe
    code_key: alpha_safe
    units_tex: "-"
    units_md: "-"
    name: Safeguard gate width
    description: Smooth gate scale in Psi that intercepts derivative singular behavior.
    category: fast_slow_parameters
  - id: sigma_e
    symbol_tex: "\\sigma_e"
    symbol_md: sigma_e
    code_key: sigma_e
    mustache_key: param_sigma_e_code
    units_tex: "\\mathrm{s}^{-1}"
    units_md: s^-1
    name: Fast linear TKE term
    description: Linear damping or growth coefficient in the fast TKE equation.
    category: fast_slow_parameters
  - id: beta_T
    symbol_tex: "\\beta_T"
    symbol_md: beta_T
    code_key: beta_t
    mustache_key: param_beta_t_code
    units_tex: "-"
    units_md: "-"
    name: Thermal stability sensitivity
    description: Controls the steepness of the bounded thermal stability response G(T_s).
    category: fast_slow_parameters
  - id: l0
    symbol_tex: "\\ell_0"
    symbol_md: l0
    code_key: l0
    mustache_key: param_l0_code
    units_tex: "\\mathrm{m}"
    units_md: m
    name: Master mixing length
    description: Codimension-one geometric control parameter for manifold fold geometry.
    category: closure_parameters
  - id: K
    symbol_tex: K
    symbol_md: K
    code_key: K
    mustache_key: param_k_code
    units_tex: "\\mathrm{m}\\,\\mathrm{s}^{-2}"
    units_md: m s^-2
    name: Buoyant destruction scale
    description: Kinematic buoyancy scale in production-minus-buoyancy forcing balance.
    category: closure_parameters
  - id: C_skin
    symbol_tex: "C_{\\mathrm{skin}}"
    symbol_md: C_skin
    code_key: C_skin
    mustache_key: param_c_skin_code
    units_tex: "\\mathrm{J}\\,\\mathrm{m}^{-2}\\,\\mathrm{K}^{-1}"
    units_md: J m^-2 K^-1
    name: Surface thermal capacity
    description: Heat capacity of the surface skin layer in the SEB closure.
    category: closure_parameters
  - id: gamma
    symbol_tex: "\\gamma"
    symbol_md: gamma
    code_key: gamma
    units_tex: "\\mathrm{s}^{-1}"
    units_md: s^-1
    name: Effective drag coefficient
    description: State-dependent drag scaling used in reduced momentum equations.
    category: closure_parameters
  - id: C_H
    symbol_tex: C_H
    symbol_md: C_H
    code_key: CH
    units_tex: "-"
    units_md: "-"
    name: Heat exchange coefficient
    description: Surface-layer heat transfer coefficient from roughness-based closure.
    category: closure_parameters
  - id: K_m
    symbol_tex: K_m
    symbol_md: K_m
    code_key: K_m
    units_tex: "\\mathrm{m}^2\\,\\mathrm{s}^{-1}"
    units_md: m^2 s^-1
    name: Eddy viscosity for momentum
    description: Turbulent eddy viscosity controlling momentum diffusion in the column closure.
    category: closure_parameters
  - id: K_h
    symbol_tex: K_h
    symbol_md: K_h
    code_key: K_h
    units_tex: "\\mathrm{m}^2\\,\\mathrm{s}^{-1}"
    units_md: m^2 s^-1
    name: Eddy diffusivity for heat
    description: Turbulent eddy diffusivity controlling thermodynamic transport.
    category: closure_parameters
  - id: Ri_g
    symbol_tex: "\\mathrm{Ri}_g"
    symbol_md: Ri_g
    code_key: Ri_g
    units_tex: "-"
    units_md: "-"
    name: Gradient Richardson number
    description: Local stability ratio of buoyancy suppression to shear production.
    category: closure_parameters
  - id: Pr_t
    symbol_tex: "\\mathrm{Pr}_t"
    symbol_md: Pr_t
    code_key: Pr_t
    units_tex: "-"
    units_md: "-"
    name: Turbulent Prandtl number
    description: Ratio of momentum diffusivity to heat diffusivity, Pr_t = K_m/K_h.
    category: closure_parameters
  - id: kappa
    symbol_tex: "\\kappa"
    symbol_md: kappa
    code_key: kappa
    units_tex: "-"
    units_md: "-"
    name: Von Karman constant
    description: Surface-layer similarity constant used in momentum and heat closures.
    category: closure_parameters
  - id: alpha
    symbol_tex: "\\alpha"
    symbol_md: alpha
    code_key: alpha
    units_tex: "-"
    units_md: "-"
    name: Legacy gate scaling parameter
    description: Legacy closure/gating parameter retained for notation compatibility with prior drafts.
    category: closure_parameters
  - id: beta
    symbol_tex: "\\beta"
    symbol_md: beta
    code_key: beta
    units_tex: "-"
    units_md: "-"
