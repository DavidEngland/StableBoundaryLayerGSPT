    description: Legacy non-dimensional fast-subsystem coefficient superseded by sigma_e in the canonical split.
    category: closure_parameters
  - id: eta
    symbol_tex: "\\eta"
    symbol_md: eta
    code_key: eta
    units_tex: "-"
    units_md: "-"
    name: Shear production efficiency
    description: Closure ratio parameter controlling shear production scaling.
    category: closure_parameters
  - id: delta_u
    symbol_tex: "\\delta_u"
    symbol_md: delta_u
    code_key: delta_u
    units_tex: "\\mathrm{m}\\,\\mathrm{s}^{-1}"
    units_md: m s^-1
    name: Velocity regularization floor
    description: Small velocity-scale floor used to regularize near-calm mechanical limits.
    category: closure_parameters
  - id: phi_m
    symbol_tex: "\\phi_m"
    symbol_md: phi_m
    code_key: phi_m
    units_tex: "-"
    units_md: "-"
    name: Momentum stability function
    description: Monin-Obukhov similarity stability function for momentum transport.
    category: closure_parameters
  - id: phi_h
    symbol_tex: "\\phi_h"
    symbol_md: phi_h
    code_key: phi_h
    units_tex: "-"
    units_md: "-"
    name: Heat stability function
    description: Monin-Obukhov similarity stability function for heat transport.
    category: closure_parameters
  - id: U_g
    symbol_tex: U_g
    symbol_md: U_g
    code_key: U_g
    units_tex: "\\mathrm{m}\\,\\mathrm{s}^{-1}"
    units_md: m s^-1
    name: Zonal geostrophic wind
    description: Large-scale zonal geostrophic forcing component.
    category: closure_parameters
  - id: V_g
    symbol_tex: V_g
    symbol_md: V_g
    code_key: V_g
    units_tex: "\\mathrm{m}\\,\\mathrm{s}^{-1}"
    units_md: m s^-1
    name: Meridional geostrophic wind
    description: Large-scale meridional geostrophic forcing component.
    category: closure_parameters
  - id: T_a
    symbol_tex: T_a
    symbol_md: T_a
    code_key: T_a
