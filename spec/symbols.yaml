  - id: h_max
    symbol_tex: h_{\max}
    symbol_md: h_max
    code_key: h_max
    units_tex: "\\mathrm{m}"
    units_md: m
    name: Maximum effective boundary-layer height
    description: Upper clamp bound for emergent effective boundary-layer depth.
    category: closure_parameters
  - id: c1
    symbol_tex: c_1
    symbol_md: c1
    code_key: c1
