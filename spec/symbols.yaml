  - id: C_D
    symbol_tex: C_D
    symbol_md: C_D
    code_key: C_D
    units_tex: "-"
    units_md: "-"
    name: Neutral drag coefficient
    description: Surface drag coefficient setting momentum exchange strength.
    category: closure_parameters
  - id: C_s
    symbol_tex: C_s
    symbol_md: C_s
    code_key: C_s
    units_tex: "-"
    units_md: "-"
    name: Surface heat exchange coefficient
    description: Legacy heat exchange coefficient notation retained for compatibility with prior sections.
    category: closure_parameters
  - id: h_min
    symbol_tex: h_{\min}
    symbol_md: h_min
    code_key: h_min
    units_tex: "\\mathrm{m}"
    units_md: m
